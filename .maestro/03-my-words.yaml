# My Words, reached through the side drawer.
# menu_my_words = "My Words" in core/designsystem/src/main/res/values/strings.xml.
appId: com.sublearn.app.debug
name: My Words
---
- launchApp
- extendedWaitUntil:
    visible: "Continue watching"
    timeout: 30000
# Opens the drawer: on Home this is the hamburger (its contentDescription is R.string.menu_settings).
- tapOn:
    text: "^Settings$"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "^My Words$"
    commands:
      - tapOn:
          point: "7%,6%"
      - waitForAnimationToEnd
- tapOn:
    text: "^My Words$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: my-words

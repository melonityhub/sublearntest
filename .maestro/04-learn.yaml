# The Learn tab (bottom navigation).
# tab_learn = "Learn" in core/designsystem/src/main/res/values/strings.xml.
appId: com.sublearn.app.debug
name: Learn
---
- launchApp
- extendedWaitUntil:
    visible: "Continue watching"
    timeout: 30000
- tapOn:
    text: "^Learn$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: learn
